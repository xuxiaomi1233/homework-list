<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>作业清单</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    background: #f6f4ef; color: #1a1a1a;
    padding: 16px; padding-bottom: calc(32px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 26px; font-weight: 600; margin: 8px 4px 4px; }
  .date { font-size: 15px; color: #8a8578; margin: 0 4px 20px; }
  .card {
    background: #fff; border-radius: 16px; padding: 18px 16px 8px;
    margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 12px; gap: 8px; }
  .name {
    font-size: 24px; font-weight: 600; letter-spacing: 1px;
    border: none; background: transparent; min-width: 0; flex: 1;
    font-family: inherit; color: inherit;
    border-bottom: 2px dashed transparent; border-radius: 0;
  }
  .name:focus { outline: none; border-bottom-color: #c9c3b4; }
  .progress { font-size: 16px; color: #8a8578; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .progress b { color: #1a1a1a; font-weight: 600; }
  .bar { height: 6px; background: #eeeae0; border-radius: 999px; overflow: hidden; margin: 0 4px 10px; }
  .bar i { display: block; height: 100%; width: 0; background: #3ba272; border-radius: 999px; transition: width .25s ease; }
  ul { list-style: none; }
  li {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 4px; border-top: 1px solid #f0ede4;
    font-size: 20px; line-height: 1.5; user-select: none;
  }
  li .check {
    appearance: none; -webkit-appearance: none;
    width: 28px; height: 28px; flex-shrink: 0; margin-top: 3px;
    border: 2px solid #c9c3b4; border-radius: 8px; cursor: pointer; position: relative;
    transition: background .15s ease, border-color .15s ease;
  }
  li .check:checked { background: #3ba272; border-color: #3ba272; }
  li .check:checked::after {
    content: ""; position: absolute; left: 8px; top: 3px;
    width: 7px; height: 13px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg);
  }
  .txt { flex: 1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 0; min-width: 0; }
  .subj {
    font-size: 14px; font-weight: 600; border-radius: 6px; padding: 2px 8px;
    margin-right: 6px; white-space: nowrap; border: none; font-family: inherit;
    width: 4.5em; text-align: center;
  }
  .subj.yw { background: #e8efff; color: #3b6fd4; }
  .subj.sx { background: #fdeceb; color: #d4574f; }
  .subj.yy { background: #e6f5ee; color: #2e8f66; }
  .subj.qt { background: #efede6; color: #6e6a5e; }
  .content {
    flex: 1; min-width: 8em; font-size: 20px; font-family: inherit; color: inherit;
    border: none; background: transparent; border-bottom: 2px dashed transparent; border-radius: 0;
  }
  .content:focus { outline: none; border-bottom-color: #c9c3b4; }
  .opt {
    display: block; width: 100%; margin-top: 4px;
    font-size: 15px; color: #b07a2a;
    border: none; background: transparent; font-family: inherit;
    border-bottom: 2px dashed transparent; border-radius: 0;
  }
  .opt:focus { outline: none; border-bottom-color: #e3d5b8; color: #8a5f14; }
  .opt:placeholder-shown { border-bottom: 2px dashed #e8e2d2; }
  .opt::placeholder { color: transparent; }
  .del {
    flex-shrink: 0; align-self: center; width: 32px; height: 32px;
    border: none; background: transparent; color: #d9d4c5; font-size: 22px; line-height: 1;
    cursor: pointer; border-radius: 8px; padding: 0;
  }
  .del:active { background: #f2efe6; color: #d4574f; }
  li.done .content, li.done .subj, li.done .opt { text-decoration: line-through; color: #b5b0a1; }
  .add-row { padding: 12px 4px 8px; border-top: 1px solid #f0ede4; }
  .btn-add {
    font: inherit; font-size: 16px; width: 100%;
    border: 1.5px dashed #d9d4c5; background: transparent; color: #8a8578;
    border-radius: 10px; padding: 12px; cursor: pointer;
  }
  .btn-add:active { background: #f2efe6; }
  .tools { display: flex; gap: 12px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }
  .tools button {
    font: inherit; font-size: 16px;
    border: 1px solid #ddd6c6; background: #fff; color: #6e6a5e;
    border-radius: 999px; padding: 12px 28px; cursor: pointer;
  }
  .tools button:active { background: #f2efe6; }
</style>
<base target="_blank">
</head>
<body>

<h1>📋 作业清单</h1>

<div id="cards"></div>

<div class="tools">
  <button id="addCard">＋ 添加学生</button>
  <button id="exportBtn">导出清单</button>
  <button id="reset">全部重置</button>
</div>

<script>
(function () {
  var SUBJECTS = ['语文', '数学', '英语', '物理', '化学', '生物', '历史', '地理', '政治'];
  var CLS = { '语文': 'yw', '数学': 'sx', '英语': 'yy' };

  var DEFAULT = [
    { name: '郭欣妍', items: [
      { s: '语文', t: '', o: '', d: false },
      { s: '数学', t: '', o: '', d: false },
      { s: '英语', t: '', o: '', d: false },
      { s: '生物', t: '', o: '', d: false },
      { s: '地理', t: '', o: '', d: false },
      { s: '历史', t: '', o: '', d: false }
    ]},
    { name: '郭汉城', items: [
      { s: '语文', t: '', o: '', d: false },
      { s: '数学', t: '', o: '', d: false },
      { s: '英语', t: '', o: '', d: false }
    ]}
  ];

  var data;
  try { data = JSON.parse(localStorage.getItem('hw_data_v4')); } catch (e) { data = null; }
  if (!data || !Array.isArray(data.cards) || !data.cards.length) {
    data = { cards: JSON.parse(JSON.stringify(DEFAULT)) };
  }

  function save() {
    try { localStorage.setItem('hw_data_v4', JSON.stringify(data)); } catch (e) {}
  }

  function subjClass(s) { return CLS[s] || 'qt'; }

  function makeSubjectSelect(val) {
    var sel = document.createElement('select');
    sel.className = 'subj ' + subjClass(val);
    SUBJECTS.forEach(function (s) {
      var o = document.createElement('option');
      o.value = o.textContent = s;
      if (s === val) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () {
      sel.className = 'subj ' + subjClass(sel.value);
      sel.closest('li').dispatchEvent(new CustomEvent('itemchange', { bubbles: true }));
    });
    return sel;
  }

  function renderItem(cardIdx, itemIdx) {
    var it = data.cards[cardIdx].items[itemIdx];
    var li = document.createElement('li');
    if (it.d) li.classList.add('done');

    var chk = document.createElement('input');
    chk.type = 'checkbox'; chk.className = 'check'; chk.checked = it.d;
    chk.addEventListener('change', function () {
      it.d = chk.checked; save(); refresh();
    });

    var txt = document.createElement('div'); txt.className = 'txt';

    var sel = makeSubjectSelect(it.s);
    sel.addEventListener('itemchange', function () { it.s = sel.value; save(); });

    var inp = document.createElement('input');
    inp.className = 'content'; inp.value = it.t; inp.placeholder = '作业内容';
    inp.addEventListener('input', function () { it.t = inp.value; save(); });

    var optWrap = document.createElement('span');
    optWrap.style.cssText = 'flex-basis:100%;';
    var opt = document.createElement('input');
    opt.className = 'opt'; opt.value = it.o; opt.placeholder = '';
    opt.addEventListener('input', function () { it.o = opt.value; save(); });
    optWrap.appendChild(opt);

    var del = document.createElement('button');
    del.className = 'del'; del.textContent = '×'; del.title = '删除这条';
    del.addEventListener('click', function () {
      if (!confirm('删除这条作业？')) return;
      data.cards[cardIdx].items.splice(itemIdx, 1); save(); render();
    });

    txt.appendChild(sel); txt.appendChild(inp); txt.appendChild(optWrap);
    li.appendChild(chk); li.appendChild(txt); li.appendChild(del);
    return li;
  }

  function renderCard(cardIdx) {
    var card = data.cards[cardIdx];
    var el = document.createElement('div');
    el.className = 'card';

    var head = document.createElement('div'); head.className = 'card-head';
    var name = document.createElement('input');
    name.className = 'name'; name.value = card.name;
    name.addEventListener('input', function () { card.name = name.value; save(); });
    var prog = document.createElement('span'); prog.className = 'progress';
    prog.innerHTML = '<b class="done-n">0</b> / <span class="total-n">0</span>';
    head.appendChild(name); head.appendChild(prog);

    var bar = document.createElement('div'); bar.className = 'bar';
    bar.innerHTML = '<i></i>';

    var ul = document.createElement('ul');
    card.items.forEach(function (_, i) { ul.appendChild(renderItem(cardIdx, i)); });

    var addRow = document.createElement('div'); addRow.className = 'add-row';
    var addBtn = document.createElement('button');
    addBtn.className = 'btn-add'; addBtn.textContent = '＋ 添加一条作业';
    addBtn.addEventListener('click', function () {
      card.items.push({ s: '语文', t: '', o: '', d: false }); save(); render();
      var inputs = el.querySelectorAll('.content');
      if (inputs.length) inputs[inputs.length - 1].focus();
    });
    addRow.appendChild(addBtn);

    el.appendChild(head); el.appendChild(bar); el.appendChild(ul); el.appendChild(addRow);
    return el;
  }

  function refresh() {
    data.cards.forEach(function (card, ci) {
      var el = document.querySelectorAll('#cards .card')[ci];
      if (!el) return;
      var n = card.items.filter(function (i) { return i.d; }).length;
      el.querySelector('.done-n').textContent = n;
      el.querySelector('.total-n').textContent = card.items.length;
      el.querySelector('.bar i').style.width = (card.items.length ? n / card.items.length * 100 : 0) + '%';
      el.querySelectorAll('li').forEach(function (li, ii) {
        li.classList.toggle('done', !!card.items[ii].d);
        li.querySelector('.check').checked = !!card.items[ii].d;
      });
    });
  }

  function render() {
    var box = document.getElementById('cards');
    box.innerHTML = '';
    data.cards.forEach(function (_, i) { box.appendChild(renderCard(i)); });
    refresh();
  }

  document.getElementById('addCard').addEventListener('click', function () {
    var name = prompt('新学生姓名：');
    if (!name) return;
    data.cards.push({ name: name, items: [] }); save(); render();
  });

  document.getElementById('exportBtn').addEventListener('click', function () {
    var src = document.documentElement.outerHTML;
    // 用当前数据替换 DEFAULT
    var re = /var DEFAULT = [\s\S]*?\n  \];/;
    var newDefault = 'var DEFAULT = ' + JSON.stringify(data.cards, null, 6).replace(/\n/g, '\n  ') + ';';
    var out = src.replace(re, newDefault);
    var blob = new Blob([out], { type: 'text/html;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '作业清单.html';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });

  document.getElementById('reset').addEventListener('click', function () {
    if (!confirm('确定清空所有打勾记录吗？（不会删除作业条目）')) return;
    data.cards.forEach(function (c) { c.items.forEach(function (i) { i.d = false; }); });
    save(); refresh();
  });

  render();
})();
</script>
</body>
</html>
